name: Lapaza import and browser verification
on:
  push:
    branches: [puppy-care-web]
    paths: [.github/workflows/lapaza-import.yml]
permissions:
  contents: write
concurrency:
  group: lapaza-import
  cancel-in-progress: false
jobs:
  import-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: puppy-care-web
      - name: Import only the generated public app bundle
        env:
          BUNDLE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-8918-8210-80e1-2669c6387d63/raw?se=2026-10-13T18%3A48%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=ceb0bafe-f47d-5c1c-bc1f-031e86b311b9&skoid=e5e3659d-4463-4dbf-b2ce-ee32bc0a0a8d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T05%3A06%3A32Z&ske=2026-10-14T05%3A06%3A32Z&sks=b&skv=2026-02-06&sig=Lu21aWrDIV18lb09v3i2FLw5iMM8JtuoQeovmKDXIkM%3D'
        run: |
          python - <<'PY'
          import hashlib, io, os, pathlib, urllib.request, zipfile
          data = urllib.request.urlopen(os.environ['BUNDLE_URL'], timeout=60).read()
          expected = '3d38aa4d35747f1faca1ae13014a452d9926ae6bbbc88dff9003a7fa388cb7f5'
          assert hashlib.sha256(data).hexdigest() == expected, 'Bundle checksum mismatch'
          root = pathlib.Path('puppy-care').resolve()
          root.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for member in archive.infolist():
                  target = (root / member.filename).resolve()
                  assert target.is_relative_to(root), 'Unsafe archive path'
              archive.extractall(root)
          test = root / 'qa/test_app.py'
          source = test.read_text()
          source = source.replace('from playwright.sync_api import sync_playwright', 'from playwright.sync_api import sync_playwright, expect')
          start = source.index('page.wait_for_function(')
          end = source.index(";ok('Explicit offline cache completed')", start)
          source = source[:start] + "expect(page.locator('#offline-status')).to_contain_text('Готово:',timeout=15000)" + source[end:]
          test.write_text(source)
          print('Imported generated static app only; no filled family records.')
          PY
      - name: Install browser test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify syntax and browser interactions
        run: |
          node --check puppy-care/site/app.js
          node --check puppy-care/site/games.js
          python puppy-care/qa/test_app.py
      - name: Preserve browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lapaza-browser-evidence
          path: |
            puppy-care/qa/*.png
            puppy-care/qa/test_results.json
          if-no-files-found: ignore
      - name: Publish verified static files to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add puppy-care/site puppy-care/README.md puppy-care/state.md puppy-care/qa/test_app.py puppy-care/qa/test_results.json
          git commit -m 'Publish tested Lapaza puppy care web app'
          git push origin HEAD:puppy-care-web
          echo "Published app commit: $(git rev-parse HEAD)"
