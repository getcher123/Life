name: Lapaza verification and public-link smoke test
on:
  push:
    branches: [puppy-care-web]
    paths:
      - .github/workflows/lapaza-import.yml
      - puppy-care/site/**
      - puppy-care/qa/test_app.py
      - puppy-care/qa/test_public.py
permissions:
  contents: write
concurrency:
  group: lapaza-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: puppy-care-web
      - name: Install browser test runtime
        run: |
          python -m pip install playwright > /tmp/puppy-install.log 2>&1
          python -m playwright install --with-deps chromium >> /tmp/puppy-install.log 2>&1 || { tail -60 /tmp/puppy-install.log; exit 1; }
      - name: Verify local app, storage, source fidelity and offline behavior
        run: |
          node --check puppy-care/site/app.js
          python puppy-care/qa/test_app.py
      - name: Verify actual public app after visible hosting confirmation
        run: python puppy-care/qa/test_public.py
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lapaza-browser-evidence
          path: |
            puppy-care/qa/*.png
            puppy-care/qa/*.json
            puppy-care/qa/public-failure.html
          if-no-files-found: ignore
      - name: Record verification and handoff
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('puppy-care')
          native=json.loads((root/'qa/test_results.json').read_text())
          live=json.loads((root/'qa/public_smoke_results.json').read_text())
          (root/'state.md').write_text('# Лапа за лапой — опубликованная версия\n\nДата: 2026-10-13.\nПубличный адрес: '+live['public_url']+'\n\nПервое открытие: хостинг показывает кнопку Open the page. Это видимое подтверждение пользователя, не обходить его.\n\nНативный браузер: '+str(native['passed'])+' проверок прошли. Внешняя ссылка: '+str(live['passed'])+' проверок прошли.\n\n30 разделов книги, 41 источник, 24 исходных изображения, 3 новых настоящих фото и 4 новых AI-иллюстрации. Все активы локальные. Source manifest: site/source-manifest.json.\n\nНа общем домене отключены личная карточка, медицинский журнал и свободные поля; доступны знания, игры, отметки чтения, день, обезличенные проверки и отпуск. В локальной версии и на индивидуальном домене личные записи доступны без серверной синхронизации.\n\nВетка puppy-care-web репозитория getcher123/Life. Main не изменён. При обновлении: править только puppy-care/site, прогонять qa/test_app.py и qa/test_public.py, менять CACHE в sw.js и фиксированный commit в PUBLIC_URL. Никаких секретов, аналитики и облачных личных данных в приложении нет.\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add puppy-care/state.md puppy-care/qa/test_results.json puppy-care/qa/public_smoke_results.json
          git diff --cached --quiet || git commit -m 'Record native and live public-link browser verification'
          git push origin HEAD:puppy-care-web
